name: Build and Release Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Optional manual version override (e.g. 1.0.15)'
        required: false
        default: ''

# ==============================================================================
# GITHUB ACTIONS CI/CD PIPELINE - AI Design Department Desktop Foundation
# ==============================================================================
# You must add a repository secret named GH_TOKEN containing
# a GitHub Personal Access Token with repo/contents write permission.
#
# Why GH_TOKEN is required:
# 1. Allows electron-builder to automatically draft/publish GitHub Releases and upload
#    the Windows NSIS installer (.exe) alongside the auto-updater metadata (latest.yml).
# 2. Allows the Version Conflict Handler step to push version-bump commits back to 'main'.
# ==============================================================================

jobs:
  build:
    name: Build & Publish Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      # Step 2: Setup Node.js (LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: npm install
      - name: npm install
        run: npm install

      # Step 4: VERSION CONFLICT HANDLER
      # Checks all existing tags and releases (both published and drafts)
      # If current version is already used, loops and auto-bumps patch version
      # Writes to package.json, commits & pushes to main, pushes git tag, and sets BUILD_VERSION
      - name: Version Conflict Handler
        id: version-handler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          # 1. Collect all git remote tags
          REMOTE_TAGS=$(git ls-remote --tags origin | sed -n 's/.*refs\/tags\///p' | sed 's/\^{}//' || true)

          # 2. Collect all GitHub releases (both published and drafts)
          API_RELEASES=$(gh api "repos/${{ github.repository }}/releases" --paginate 2>/dev/null || echo "[]")
          RELEASE_TAGS=$(echo "$API_RELEASES" | node -e '
            let data = "";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              try {
                const arr = JSON.parse(data);
                if (Array.isArray(arr)) {
                  console.log(arr.map(r => r.tag_name).join(" "));
                }
              } catch (e) {}
            });
          ')
          CLI_TAGS=$(gh release list --limit 100 2>/dev/null | awk '{print $3}' || true)

          # Combine all discovered tags
          ALL_EXISTING_TAGS="${REMOTE_TAGS} ${RELEASE_TAGS} ${CLI_TAGS}"
          echo "Existing tags and releases discovered: ${ALL_EXISTING_TAGS}"

          # 3. Check and auto-bump version in a loop until an unused version is found
          export ALL_EXISTING_TAGS
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const currentVersion = pkg.version;
            const existing = (process.env.ALL_EXISTING_TAGS || "").split(/\s+/).filter(Boolean);

            function bumpPatch(v) {
              const parts = v.split(".").map(n => parseInt(n, 10) || 0);
              while (parts.length < 3) parts.push(0);
              parts[2] += 1;
              return parts.join(".");
            }

            let version = currentVersion;
            let bumped = false;

            while (existing.includes("v" + version) || existing.includes(version)) {
              version = bumpPatch(version);
              bumped = true;
            }

            if (bumped) {
              console.log(`BUMP_NEEDED:true`);
              console.log(`OLD_VERSION:${currentVersion}`);
              console.log(`NEW_VERSION:${version}`);
              pkg.version = version;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            } else {
              console.log(`BUMP_NEEDED:false`);
              console.log(`NEW_VERSION:${currentVersion}`);
            }
          ' > version_result.txt

          cat version_result.txt

          BUMP_NEEDED=$(grep "BUMP_NEEDED:" version_result.txt | cut -d: -f2)
          NEW_VERSION=$(grep "NEW_VERSION:" version_result.txt | cut -d: -f2)
          rm -f version_result.txt

          MANUAL_INPUT="${{ github.event.inputs.manual_version }}"
          if [ -n "$MANUAL_INPUT" ]; then
            echo "Overriding version with manual input: ${MANUAL_INPUT}"
            NEW_VERSION="${MANUAL_INPUT}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '${MANUAL_INPUT}';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            BUMP_NEEDED="true"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${{ github.ref_name }}"
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" = "HEAD" ]; then
            TARGET_BRANCH="main"
          fi

          if [ "$BUMP_NEEDED" = "true" ]; then
            echo "Auto-bumped version to: ${NEW_VERSION}"
            git add package.json
            git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
            git push origin "$TARGET_BRANCH" || git push origin main || git push origin master || echo "Notice: Push skipped or protected, proceeding with build of ${NEW_VERSION}"
          else
            echo "Version ${NEW_VERSION} is unique and clear to build."
          fi

          # Always create and push the Git tag to remote so GitHub API recognizes it as valid
          git tag -f "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}" --force || true

          echo "BUILD_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      # Step 5: Build NSIS installer package & publish directly as full release
      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'false'
          EP_PRE_RELEASE: 'false'
        run: npm run dist

      # Step 6: Verify and Guarantee Published Release (Zero Drafts, Direct Publish)
      # Ensures the release is publicly published (NOT draft), cleans up orphan drafts, and all assets are uploaded
      - name: Verify and Publish Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${BUILD_VERSION}"
          echo "========================================================"
          echo "Verifying and direct publishing release: ${RELEASE_TAG}"
          echo "========================================================"

          # Check output directory files
          ls -la dist/

          # 1. Read exact expected installer filename from dist/latest.yml
          EXPECTED_NAME=""
          if [ -f "dist/latest.yml" ]; then
            EXPECTED_NAME=$(node -e '
              const fs = require("fs");
              try {
                const y = fs.readFileSync("dist/latest.yml", "utf8");
                const m = y.match(/path:\s*([^\r\n]+)/) || y.match(/url:\s*([^\r\n]+)/);
                if (m) console.log(m[1].trim());
              } catch(e) {}
            ')
          fi
          echo "Expected installer from latest.yml: ${EXPECTED_NAME}"

          # 2. Discover generated primary .exe
          PRIMARY_EXE=$(find dist -maxdepth 1 -name "*.exe" | head -n 1)
          echo "Found primary installer: ${PRIMARY_EXE}"

          # 3. Ensure both hyphenated and dot-separated filename variants exist
          if [ -n "${PRIMARY_EXE}" ] && [ -f "${PRIMARY_EXE}" ]; then
            HYPHEN_NAME="dist/AI-Design-Department-Setup-${BUILD_VERSION}.exe"
            DOT_NAME="dist/AI.Design.Department.Setup.${BUILD_VERSION}.exe"

            if [ -n "${EXPECTED_NAME}" ]; then
              cp -f "${PRIMARY_EXE}" "dist/${EXPECTED_NAME}" || true
            fi
            cp -f "${PRIMARY_EXE}" "${HYPHEN_NAME}" || true
            cp -f "${PRIMARY_EXE}" "${DOT_NAME}" || true
          fi

          # 4. Ensure both blockmap variants exist
          PRIMARY_BLOCKMAP=$(find dist -maxdepth 1 -name "*.blockmap" | head -n 1)
          if [ -n "${PRIMARY_BLOCKMAP}" ] && [ -f "${PRIMARY_BLOCKMAP}" ]; then
            cp -f "${PRIMARY_BLOCKMAP}" "dist/AI-Design-Department-Setup-${BUILD_VERSION}.exe.blockmap" || true
            cp -f "${PRIMARY_BLOCKMAP}" "dist/AI.Design.Department.Setup.${BUILD_VERSION}.exe.blockmap" || true
          fi

          echo "Files in dist after normalization:"
          ls -la dist/

          # Collect all release assets
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f \( -name "*.exe" -o -name "*.blockmap" -o -name "latest.yml" \))
          echo "Assets to upload: ${ASSETS[*]}"

          # 5. Clean up any leftover draft releases and publish them directly
          echo "Scanning for draft releases to direct-publish or clean up..."
          gh api "repos/${{ github.repository }}/releases" --paginate 2>/dev/null | node -e '
            let data = "";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              try {
                const releases = JSON.parse(data);
                if (Array.isArray(releases)) {
                  for (const r of releases) {
                    if (r.draft) {
                      console.log(`${r.id}\t${r.tag_name || ""}`);
                    }
                  }
                }
              } catch(e) {}
            });
          ' | while IFS=$'\t' read -r DRAFT_ID DRAFT_TAG; do
            if [ -n "$DRAFT_ID" ]; then
              echo "Processing draft ID: $DRAFT_ID (Tag: $DRAFT_TAG)"
              if [ -n "$DRAFT_TAG" ]; then
                echo "Directly publishing draft release $DRAFT_TAG..."
                gh api -X PATCH "repos/${{ github.repository }}/releases/$DRAFT_ID" -F draft=false -F prerelease=false || true
              else
                echo "Deleting untagged orphan draft release ID $DRAFT_ID..."
                gh api -X DELETE "repos/${{ github.repository }}/releases/$DRAFT_ID" || true
              fi
            fi
          done

          # 6. Ensure release exists on GitHub as a direct published release
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Creating direct published release ${RELEASE_TAG} on GitHub..."
            gh release create "${RELEASE_TAG}" \
              --title "AI Design Department ${RELEASE_TAG}" \
              --notes "AI Design Department desktop release ${RELEASE_TAG}" \
              --draft=false \
              --prerelease=false \
              "${ASSETS[@]}" || true
          else
            echo "Uploading all assets to release ${RELEASE_TAG}..."
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber || true
          fi

          # Guarantee that the release is published directly (NOT a draft)
          echo "Confirming release is fully published (draft=false)..."
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false || true

          # Retroactive compatibility patch for v1.0.8:
          # If release v1.0.8 exists and is missing AI-Design-Department-Setup-1.0.8.exe, upload it
          if gh release view "v1.0.8" >/dev/null 2>&1; then
            echo "Checking v1.0.8 assets for naming divergence..."
            if ! gh release view "v1.0.8" --json assets -q '.assets[].name' | grep -q "^AI-Design-Department-Setup-1.0.8.exe$"; then
              echo "Fixing v1.0.8: downloading AI.Design.Department.Setup.1.0.8.exe and uploading AI-Design-Department-Setup-1.0.8.exe..."
              gh release download "v1.0.8" -p "AI.Design.Department.Setup.1.0.8.exe" -O "temp-108.exe" || true
              if [ -f "temp-108.exe" ]; then
                cp "temp-108.exe" "AI-Design-Department-Setup-1.0.8.exe"
                gh release upload "v1.0.8" "AI-Design-Department-Setup-1.0.8.exe" --clobber || true
                rm -f "temp-108.exe" "AI-Design-Department-Setup-1.0.8.exe"
                echo "Successfully patched v1.0.8 release with AI-Design-Department-Setup-1.0.8.exe!"
              fi
            else
              echo "Release v1.0.8 already has AI-Design-Department-Setup-1.0.8.exe."
            fi
          fi

          echo "Final release status and asset verification for ${RELEASE_TAG}:"
          gh release view "${RELEASE_TAG}" || true
